name: Actualizador Continuo Monitor MINVU (Cada 15 Minutos)

on:
  schedule:
    # Minutos desfasados (7, 22, 37, 52) para evitar la congestión global de GitHub
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del pipeline
        run: |
          pip install --upgrade pip
          pip install feedparser trafilatura spacy requests pandas plotly
          python -m spacy download es_core_news_sm

      - name: Ejecutar actualización completa (Ingesta, Filtro Estricto y Sentimiento)
        run: |
          python actualizar_minvu.py

      - name: Registrar marca de tiempo y guardar cambios
        run: |
          git config --global user.name "MINVU Monitor Bot"
          git config --global user.email "bot@monitor-minvu.cl"
          date -u +"%Y-%m-%d %H:%M:%S UTC" > ultima_ejecucion.txt
          git add monitor_minvu.db ultima_ejecucion.txt
          git commit -m "Auto-update: [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]" || echo "Sin cambios nuevos"
          git push
